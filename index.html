try{const s=localStorage.getItem("review-lang-"+PN); if(s==="en"||s===L2) lang=s;}catch(e){}
const t=(k,v)=>{let x=(S[k]||[k])[IDX[lang]]||S[k][0]; x=x.split("{p}").join(PN); if(v) Object.keys(v).forEach(n=>{x=x.split("{"+n+"}").join(v[n]);}); return x;};
const pick=o=>o==null?"":(typeof o==="string"?o:(lang==="en"?(o.en||""):(o.l2||o.en||"")));
const fam=k=>FAM[k][IDX[lang]];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const a=(u,x)=>`<a href="${u}" target="_blank" rel="noopener">${esc(x)}</a>`;
const fd=d=>{if(!d)return "–";const x=new Date(d+"T00:00:00");return x.toLocaleDateString(LOCALE[lang],{day:"numeric",month:"short",year:"numeric"});};

const tot=(()=>{const r={people:P.length,enroll:0,done:0,prog:0,certs:0,bca:0,bcp:0,holders:0,expSoon:0,status:{active:0,slipping:0,stale:0,never:0}};
  P.forEach(p=>{r.enroll+=p.enroll;r.done+=p.done;r.prog+=p.prog;r.certs+=p.certs;r.bca+=p.bca;r.bcp+=p.bcp;if(p.certs)r.holders++;r.status[p.status]++;
    p.certList.forEach(c=>{if(c.active&&c.renew&&c.renew<="2027-03-31")r.expSoon++;});});r.rate=r.enroll?Math.round(100*r.done/r.enroll):0;return r;})();
const famStats=(()=>{const f={};Object.keys(FAM).forEach(k=>f[k]={certPeople:new Set(),learners:new Set()});
  P.forEach(p=>{p.certList.forEach(c=>{if(c.active&&f[c.fam])f[c.fam].certPeople.add(p.name);});p.courses.forEach(c=>{if(c.status==="Completed"&&f[c.fam])f[c.fam].learners.add(p.name);});});return f;})();

function fillTeam(){

  document.getElementById("rb").innerHTML=rows.length?rows.map(p=>{const i=P.indexOf(p);return `<tr class="click" tabindex="0" data-i="${i}"><td><strong>${esc(p.name)}</strong></td><td>${pill(p.status)}</td><td class="num">${p.done}</td><td class="num">${p.prog}</td><td class="num">${p.certs}</td><td class="small">${p.top.map(f=>esc(fam(f))).join(", ")||"–"}</td><td class="small">${fd(p.last)}</td></tr><tr hidden id="d${i}"><td colspan="7"><div class="drawer">${drawer(p)}</div></td></tr>`;}).join(""):`<tr><td colspan="7" class="empty">${t("tm_none")}</td></tr>`;
  document.querySelectorAll("tr.click").forEach(r=>{const go=()=>{const d=document.getElementById("d"+r.dataset.i);d.hidden=!d.hidden;};r.onclick=go;r.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};});

  <div class="tbl"><table><thead><tr><th>${t("c_for")}</th><th>${t("c_contact")}</th><th>${t("c_email")}</th></tr></thead><tbody>
   <tr><td>${t("k_enable")}</td><td>Nikki Sanchez, Partner Success Manager</td><td><span class="mono">${L.NIKKI}</span><button class="copy" data-c="${L.NIKKI}" type="button">${t("copy")}</button></td></tr>
   <tr><td>${t("k_team")}</td><td>Helix Partner Success</td><td><span class="mono">${L.TEAM}</span><button class="copy" data-c="${L.TEAM}" type="button">${t("copy")}</button></td></tr>
   ${PARTNER.partnerManager?`<tr><td>${t("k_pm")}</td><td>${esc(PARTNER.partnerManager)}, ${t("pm_title")}</td><td>Microsoft Teams</td></tr>`:""}
   <tr><td>${t("k_net")}</td><td>Helix Partner Network</td><td><span class="mono">${L.NET}</span><button class="copy" data-c="${L.NET}" type="button">${t("copy")}</button></td></tr>
  </tbody></table></div>
  <p style="margin-top:18px"><button class="copy" type="button" id="pdfBtn" style="padding:7px 14px;margin:0">${t("pdf")}</button></p>`;
}
const VIEWS={overview,team,plans,certs,coverage,paths,program};
let cur="overview";
function render(){
  document.documentElement.lang=lang;
  document.title=PN+" · "+t("title");
  document.getElementById("eyebrow").innerHTML=esc(PARTNER.legalName||PN)+" &nbsp;·&nbsp; Helix";
  document.querySelector("[data-i='title']").textContent=t("title");
  document.querySelector("[data-i='theme']").textContent=t("theme");
  const other=lang==="en"?L2:"en";
  document.querySelector("[data-i='bannerText']").textContent=S.banner[IDX[other]];
  document.getElementById("bannerBtn").textContent=S.bannerBtn[IDX[other]];
  document.getElementById("b-en").setAttribute("aria-pressed",lang==="en");document.getElementById("b-l2").setAttribute("aria-pressed",lang===L2);
  document.getElementById("rail").innerHTML=Object.keys(VIEWS).map(k=>`<button type="button" class="tab" data-v="${k}" ${k===cur?'aria-current="page"':""}>${t("n_"+k)}</button>`).join("");
  document.querySelectorAll("#rail .tab").forEach(b=>b.onclick=()=>go(b.dataset.v));
  Object.keys(VIEWS).forEach(k=>{const s=document.getElementById("v-"+k);s.classList.toggle("on",k===cur);if(k===cur)s.innerHTML=VIEWS[k]();});
  if(cur==="team"){fillTeam();document.getElementById("q").oninput=fillTeam;document.getElementById("fs").onchange=fillTeam;}
  document.querySelectorAll(".copy[data-c]").forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.c).then(()=>{b.textContent=t("copied");}).catch(()=>{});});
  const pb=document.getElementById("pdfBtn"); if(pb) pb.onclick=()=>{Object.keys(VIEWS).forEach(k=>{document.getElementById("v-"+k).innerHTML=VIEWS[k]();});if(document.getElementById("rb"))fillTeam();window.print();setTimeout(render,500);};
  document.getElementById("foot").innerHTML=`${t("foot")} · ${t("asOf")} ${fd(DATA.asOf)} · ${t("foot2")}`;
}
function setLang(l){lang=l;try{localStorage.setItem("review-lang-"+PN,l);}catch(e){}render();}
document.getElementById("b-en").onclick=()=>setLang("en");document.getElementById("b-l2").onclick=()=>setLang(L2);
document.getElementById("bannerBtn").onclick=()=>setLang(lang==="en"?L2:"en");
document.getElementById("themeBtn").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);r.dataset.theme=d?"light":"dark";};
function go(v){cur=v;render();try{window.scrollTo({top:0});}catch(e){}}
render();
</script>
</body>
</html>
